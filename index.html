<!DOCTYPE html>
<html>
  <head>
    <title>Baby's First Web Page</title>
    <!-- how to make comments in HTML, pseudocode for wrotes, computer does not read but humans do, trigger by using the characters at the beginning of this line or also ctrl or cmd and / -->

    <meta name = "description" content = "This is my first website.">  <!-- One of the only HTML tags with only one tag-->
    <meta name = "author" content = "Nadia Rodriguez">
    <meta name = "keywords" content = "html, css, learning"> <!---keywords are best used by search engines to help describe your website and have it easy to find-->
    <!--all these above meta tags have to do with search engines-->
    <meta charset = "UTF-8"> <!---helps to show what language this is in, helps the browser-->
  </head>

  <body>
    <header>
      <!-- What is a header? It is usually what appears at the top of the page, Titles, Headings, etc -->
    </header>
    <h1>Main Heading</h1> <!-- This is the largest of the heading tags, best used for top title-->
    <nav></nav> <!-- Generally the navigation tag (nav) goes into the header, but it can go into other places without giving an error-->
    <main>
    </main>
    <footer></footer> <!-- Goes to the bottom of the page, stays at the bottom of the page -->
  </body>
</html>
